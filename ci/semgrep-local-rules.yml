rules:
  - id: php-hardcoded-db-password-fallback
    languages: [php]
    severity: ERROR
    message: A database password has a hardcoded fallback. Require a secret from the environment instead.
    patterns:
      - pattern: "getenv('DB_PASS') ?: $FALLBACK"
      - metavariable-regex:
          metavariable: $FALLBACK
          regex: ^['"].+['"]$
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 Identification and Authentication Failures"
      presentation: configuration

  - id: compose-hardcoded-mysql-root-password
    languages: [yaml]
    severity: ERROR
    message: MYSQL_ROOT_PASSWORD is hardcoded in Compose. Supply it from a secret instead.
    patterns:
      - pattern: |
          MYSQL_ROOT_PASSWORD: $PASSWORD
      - metavariable-regex:
          metavariable: $PASSWORD
          regex: '^(?!["'']?\$\{)[A-Za-z0-9_!@#.$-]+$'
    paths:
      include:
        - "**/docker-compose*.yml"
        - "**/docker-compose*.yaml"
        - "**/compose*.yml"
        - "**/compose*.yaml"
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: "A07:2021 Identification and Authentication Failures"
      presentation: configuration

  - id: php-dynamic-file-inclusion
    languages: [php]
    severity: ERROR
    message: Dynamic file inclusion via user-controllable variable. This creates potential Local File Inclusion (LFI) or PHP Stream Wrapper (CWE-98) vulnerabilities.
    patterns:
      - pattern-either:
          - pattern: include $VAR;
          - pattern: include_once $VAR;
          - pattern: require $VAR;
          - pattern: require_once $VAR;
      - pattern-not: require __DIR__ . $EXPR;
      - pattern-not: require_once __DIR__ . $EXPR;
      - pattern-not: include __DIR__ . $EXPR;
      - pattern-not: include_once __DIR__ . $EXPR;
    metadata:
      cwe: "CWE-98: Improper Control of Generation of Code ('PHP Remote File Inclusion')"
      owasp: "A03:2021 - Injection"
      presentation: code
