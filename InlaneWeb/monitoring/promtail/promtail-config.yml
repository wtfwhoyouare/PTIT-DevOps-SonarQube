server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Thu thập và phân tích trực tiếp từ Docker Socket Scraper
  - job_name: docker_containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['container']
        regex: '(ilfreight_web|ilfreight_db)'
        action: keep

    pipeline_stages:
      # 1. Trích xuất tự động các trường JSON từ InlaneWeb App và Apache Access Log
      - json:
          expressions:
            source: source
            channel: channel
            level: level
            type: type
            class: class
            message: message
            failed_query: failed_query
            method: method
            uri: uri
            query: query
            status: status

      # 2. Phân loại KHỐI 1: Log lỗi ứng dụng web (InlaneWeb Cause Exceptions, Database & Runtime Errors)
      - match:
          selector: '{container="ilfreight_web"} |~ "(?i)(inlaneweb_app|APP-EXCEPTION|cause_chain|database_query_failure|Fatal error|Uncaught Exception|mysqli_error)"'
          stages:
            - labels:
                log_category: app_exception
                has_cause_exception: "true"
                level: error

      # 3. Phân loại KHỐI 2: Log lưu lượng HTTP từ Web Server Apache
      - match:
          selector: '{container="ilfreight_web"} |~ "(?i)(apache_http_traffic|\"source\":\"apache_http_traffic\"|\"status\":)"'
          stages:
            - labels:
                log_category: http_traffic
                traffic_type: access_flow

      # 4. Nhận diện các Vector tấn công xuất hiện trong lưu lượng HTTP (SQLi, Path Traversal, XSS)
      - match:
          selector: '{container="ilfreight_web"} |~ "(?i)(union(\\s+|%20|\\+)select|sleep\\(|benchmark\\(|or(\\s+|%20|\\+)1=1|--|load_file|into(\\s+|%20|\\+)outfile|information_schema|\\.\\./|%2e%2e%2f|<script|%3cscript)"'
          stages:
            - labels:
                log_category: http_traffic
                traffic_type: attack_vector
                level: warning

      # 5. Nhận diện phản hồi rò rỉ lỗi Error-Based và mã lỗi HTTP 4xx/5xx
      - match:
          selector: '{container="ilfreight_web"} |~ "(?i)(SQL Error|syntax error|mysqli_sql_exception|database_query_failure|Fatal error| 500 |\"status\":50[0-9]|\"status\":40[0-9])"'
          stages:
            - labels:
                log_category: http_traffic
                traffic_type: error_based_leak
                level: high
